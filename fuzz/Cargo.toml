[package]
name = "ferrion_fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
ferrion_classfile.workspace = true
ferrion_doc_comments.workspace = true
ferrion_formatter.workspace = true
ferrion_lexer.workspace = true
ferrion_parser.workspace = true
libfuzzer-sys.workspace = true

# The fuzz targets need a nightly toolchain, so they have their own workspace instead of being
# members of the root one.
[workspace]

[workspace.dependencies]
ferrion_classfile = { path = "../crates/ferrion_classfile" }
ferrion_doc_comments = { path = "../crates/ferrion_doc_comments" }
ferrion_formatter = { path = "../crates/ferrion_formatter" }
ferrion_lexer = { path = "../crates/ferrion_lexer" }
ferrion_parser = { path = "../crates/ferrion_parser" }

libfuzzer-sys = "0.4.13"

[profile.release]
debug = 1

[[bin]]
name = "lex"
path = "fuzz_targets/lex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lex_fragments"
path = "fuzz_targets/lex_fragments.rs"
test = false
doc = false
bench = false

[[bin]]
name = "javadoc"
path = "fuzz_targets/javadoc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "markdown"
path = "fuzz_targets/markdown.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format"
path = "fuzz_targets/format.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classfile"
path = "fuzz_targets/classfile.rs"
test = false
doc = false
bench = false

[[bin]]
name = "signature"
path = "fuzz_targets/signature.rs"
test = false
