[package]
name = "bench"
description = "Benchmarks Ferrion's components, and compares two runs to catch regressions."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
corpus = { path = "../corpus" }
ferrion_classfile = { path = "../../crates/ferrion_classfile" }
ferrion_diagnostics = { path = "../../crates/ferrion_diagnostics" }
ferrion_lexer = { path = "../../crates/ferrion_lexer" }
ferrion_parser = { path = "../../crates/ferrion_parser" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["resource"] }

[lints]
workspace = true
