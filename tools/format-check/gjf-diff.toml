# Lines that differ between Ferrion's output and Google Java Format's, per corpus project, from
# `cargo format-check gjf` (see "Google Java Format comparison" in docs/design/formatter.md).
# `compared` and `identical` count files, and `differing-lines` is the sum of each compared file's
# insertions plus deletions in a line diff. `cargo format-check gjf --check` fails if a project's
# differing lines are above the number here, or its files compared below it; a change that lowers
# the differing lines records the new numbers with `cargo format-check gjf --update`. This file's history is the record over time.
#
# These numbers are from the exit check (work order step 4): 18,071 lines in all, with 95.6% of the
# files identical. Most of what's left is text blocks and long `//` comments, which are departures
# (docs/style.md). The first pass over the core gave 72,212 lines, with 90% identical; the
# construct rules (step 2) gave 74,204, with 88%. The formatter's core, whose first rule printed
# every construct with single spaces and line breaks, gave 1,156,515; each input compared
# unchanged, before the formatter, gave 1,747,623, most of lucene's in a few generated files.

