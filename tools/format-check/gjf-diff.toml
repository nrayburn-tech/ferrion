# Lines that differ between Ferrion's output and Google Java Format's, per corpus project, from
# `cargo format-check gjf` (see "Google Java Format comparison" in docs/design/formatter.md).
# `compared` and `identical` count files, and `differing-lines` is the sum of each compared file's
# insertions plus deletions in a line diff. `cargo format-check gjf --check` fails if a project's
# differing lines are above the number here; a change that lowers them records the new numbers
# with `cargo format-check gjf --update`. This file's history is the record over time.
#
# The starting baseline is the formatter's core (work order step 1), whose first rule prints every
# construct with single spaces and line breaks. It is further from GJF than guava's and lucene's
# files as written, which GJF formats, and closer than the other projects' files. Measured before
# the formatter, with each input compared unchanged, the total was 1,747,623 lines; most of
# lucene's differing lines are in a few generated files.

