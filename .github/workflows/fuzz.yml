name: Fuzz

on:
  # CI runs every target briefly on each change (the fuzz job in ci.yml).
  workflow_call:
    inputs:
      seconds:
        description: How long to run each fuzz target, in seconds.
        type: number
        required: true
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long to run each fuzz target, in seconds.
        type: number
        default: 1800

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Scheduled runs have no inputs.
  FUZZ_SECONDS: ${{ inputs.seconds || 1800 }}

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - run: rustup toolchain install
      - name: Install the nightly toolchain pinned in fuzz/rust-toolchain.toml
        working-directory: fuzz
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Check the fuzz crate
        run: |
          cargo fmt --manifest-path fuzz/Cargo.toml --check
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build the fuzz targets
        working-directory: fuzz
        run: cargo fuzz build --sanitizer none --debug-assertions
      # The corpus that earlier scheduled runs built up.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - name: Run each fuzz target for ${{ env.FUZZ_SECONDS }} seconds
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            mkdir -p "corpus/$target" "seeds/$target"
            cargo fuzz run --sanitizer none --debug-assertions "$target" \
              "corpus/$target" "seeds/$target" -- \
              -dict=java.dict -max_total_time="$FUZZ_SECONDS" -timeout=10
          done
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
      - name: Minimize the corpus
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        working-directory: fuzz
        run: |
          for target in $(cargo fuzz list); do
            cargo fuzz cmin --sanitizer none --debug-assertions "$target" "corpus/$target"
          done
      - if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
