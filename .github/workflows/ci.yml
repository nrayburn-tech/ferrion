name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace --locked

  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The syntax tree's SyntaxKind and typed views are generated from its grammar file.
      - name: Check that the generated syntax code matches crates/ferrion_syntax/java.grammar
        run: |
          cargo codegen
          git diff --exit-code

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      # The fuzz crate is its own workspace, so it is checked separately.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: fuzz/Cargo.toml

  # Performance regressions (docs/design/benchmarks.md): the pull request's base and head run the
  # same benchmarks on the same inputs in this job, and instruction and heap counts may grow by no
  # more than tools/bench/thresholds.toml allows. Times and peak RSS go in the job summary for a
  # reviewer to judge.
  bench:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
      - run: sudo apt-get install --yes --no-install-recommends valgrind
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Its sources and its jars, where the benchmarks read them.
      - name: Fetch a corpus project
        run: cargo corpus fetch jedis
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # The head's harness is kept for the comparison: after the base builds into the same target/,
      # cargo counts the base's builds as up to date in the head's checkout too, since the base's
      # files are newer.
      - name: Run the benchmarks on the head
        run: |
          cargo benchmark run --callgrind --no-skip --time 2 --out "$RUNNER_TEMP/head.json"
          cp target/release/bench "$RUNNER_TEMP/bench"
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check out the base
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          git worktree add "$RUNNER_TEMP/base" FETCH_HEAD
      # In the same target directory, so the dependencies built for the head are reused.
      - name: Run the benchmarks on the base
        run: |
          cd "$RUNNER_TEMP/base"
          if [ ! -d tools/bench ]; then
            echo "The base has no benchmarks."
            exit 0
          fi
          cargo benchmark run --callgrind --time 2 --out "$RUNNER_TEMP/base.json"
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Compare the base and head
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/base.json" ]; then
            echo "The base has no benchmarks to compare with." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$RUNNER_TEMP/bench" compare --markdown "$RUNNER_TEMP/base.json" "$RUNNER_TEMP/head.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  fuzz:
    uses: ./.github/workflows/fuzz.yml
    with:
      seconds: 60

  scancode:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tools/scancode/requirements.txt
      - run: sudo apt-get install --yes --no-install-recommends libmagic1 libmagic-mgc
      - run: python tools/scancode/scan.py

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # JDK 21 is jedis's, which its names comparison runs on (JAVA_HOME_21_X64); the last one set
      # up is JAVA_HOME.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      # cargo test checks that the tables come from the latest release; this checks that they're
      # what that JDK reports.
      - name: Check that the Unicode tables match the JDK
        run: |
          java tools/unicode-tables/UnicodeTables.java > crates/ferrion_lexer/src/unicode_tables.rs
          git diff --exit-code -- crates/ferrion_lexer/src/unicode_tables.rs
      - name: Build the javac oracle
        working-directory: tools/javac-oracle
        run: mvn --batch-mode --no-transfer-progress package
      - name: Run the javac oracle
        run: >-
          java -jar tools/javac-oracle/target/javac-oracle.jar --release 17
          tools/javac-oracle/src/test/resources/Sample.java
          | jq --exit-status '.diagnostics == [] and .tokens[-1][0] == "EOF" and (.tree | length) > 0'
      # Diagnostics name their feature, and deep input parses on the oracle's large stack.
      - name: Check the javac oracle's diagnostics and tree
        run: |
          java -jar tools/javac-oracle/target/javac-oracle.jar --release 8 --sections diagnostics \
            tools/javac-oracle/src/test/resources/Sample.java \
            | jq --exit-status '.diagnostics[0].args[0] == "compiler.misc.feature.records"'
          deep="$RUNNER_TEMP/Deep.java"
          printf 'class Deep { int x = %s1%s; }\n' "$(printf '(%.0s' $(seq 10000))" \
            "$(printf ')%.0s' $(seq 10000))" > "$deep"
          java -jar tools/javac-oracle/target/javac-oracle.jar --release 27 --sections tree "$deep" \
            | jq --exit-status '(.crash | not) and ([.tree[][3]] | max) > 10000'
      # A platform type's key, a local's, and the source set's summary line.
      - name: Check the javac oracle's names
        run: >-
          java -jar tools/javac-oracle/target/javac-oracle.jar names --release 17
          tools/javac-oracle/src/test/resources/Sample.java
          | jq --exit-status --slurp '.[0].diagnostics == []
          and (.[0].names | any(.[4] == "type java/lang/IllegalArgumentException platform"))
          and (.[0].names | any(.[2] == "expression" and (.[4] | startswith("local "))))
          and (.[1].sourceSet | has("millis"))'
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch a corpus project
        run: cargo corpus fetch jedis
      # Kept out of target/, so the Rust cache doesn't save them.
      - name: Check out the corpus
        run: cargo corpus checkout
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Compare the lexer with javac at each file's release
        run: cargo oracle tokens
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Check the known differences from javac
        run: cargo oracle differences
      - name: Check the snapshots of javac's parser output
        run: cargo oracle parser-cases
      - name: Check that the parser reproduces every corpus file, and its throughput
        run: cargo parser-check round-trip
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # The seed and sample size are the ones tools/parser-check/thresholds.toml is set from.
      - name: Check error recovery on mutated corpus files
        run: cargo parser-check mutate --seed 1 --sample 2000
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check the formatter's safety properties on the corpus project, and its throughput
        run: cargo format-check verify jedis
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # These download the pinned Google Java Format jar (tools/format-check/gjf.toml) into the
      # corpus directory, and run it on this job's JDK.
      - name: Check the departures from Google Java Format
        run: cargo format-check differences
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check that the formatter's snapshots are Google Java Format's output
        run: cargo format-check snapshots
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check the diff against Google Java Format
        run: cargo format-check gjf jedis --check
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Build the javap oracle
        working-directory: tools/javap-oracle
        run: mvn --batch-mode --no-transfer-progress package
      # The latest JDK's own release, and the fetched project's jars; the weekly oracle workflow
      # covers every release of every JDK in the matrix.
      - name: Compare class file reading with javap, jrt, java.util.zip, and javac
        run: cargo oracle classfile --jdk "$JAVA_HOME" --release 27 jedis
        env:
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      # The fetched project's two source sets compile in about 15 seconds, on JDK 21, the one its
      # lock names; the weekly oracle workflow runs every project.
      - name: Compare name resolution with javac
        run: cargo oracle names jedis
        env:
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
