name: Oracle

# The full javac comparison: every corpus file at each primary release (the LTS releases and the
# latest), and javac's own tests at the releases they're compiled at. Pull requests compare each
# corpus file at its own release only (see ci.yml). The parser's own checks run here on javac's
# tests too, and on a larger mutation sample. The formatter's checks run on the whole corpus and
# javac's tests, and its diff against Google Java Format on every corpus project.
# The class file comparison runs on every JDK of the matrix and on every corpus project's jars;
# pull requests check one JDK's own release and one project's jars.
# The name resolution and type attribution comparisons compile every source set of every corpus
# project; pull requests run one small project.

on:
  schedule:
    # Mondays at 05:17 UTC.
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  tokens:
    name: tokens at the primary releases
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Build the javac oracle
        working-directory: tools/javac-oracle
        run: mvn --batch-mode --no-transfer-progress package
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The corpus and javac's output are kept out of target/, so the Rust cache doesn't save them.
      - name: Check out the corpus
        run: cargo corpus checkout
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Compare the lexer with javac at the primary releases
        run: cargo oracle tokens --primary-releases --json oracle-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oracle-report
          path: oracle-report.json
          if-no-files-found: ignore

  parser:
    name: parser checks on javac's tests and a larger mutation sample
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The corpus and javac's tests are kept out of target/, so the Rust cache doesn't save them.
      # (The runner context isn't available in a job's env, only in a step's.)
      - name: Check out the corpus and javac's tests
        run: |
          cargo corpus checkout
          cargo corpus jdk-tests
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # Pull requests check the corpus projects (see ci.yml); javac's tests add unusual and broken
      # input, and its deep-nesting tests.
      - name: Check that the parser reproduces javac's tests, and its throughput
        run: cargo parser-check round-trip jdk-tests
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # Ten times the pull requests' sample, with another seed, against the same thresholds.
      - name: Check error recovery on more mutated corpus files
        run: cargo parser-check mutate --seed 2 --sample 20000
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus

  formatter:
    name: formatter checks on the whole corpus and javac's tests
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # Google Java Format runs on the JDK pinned in tools/format-check/gjf.toml.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check out the corpus and javac's tests
        run: |
          cargo corpus checkout
          cargo corpus jdk-tests
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check the formatter's safety properties on every corpus file
        run: cargo format-check verify
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check the formatter's safety properties on javac's tests
        run: cargo format-check verify jdk-tests
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check range formatting on every corpus file, broken at random tokens
        run: cargo format-check ranges
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Check the diff against Google Java Format on every corpus project
        run: cargo format-check gjf --check
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus

  jdk-tests:
    name: javac's tests
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Build the javac oracle
        working-directory: tools/javac-oracle
        run: mvn --batch-mode --no-transfer-progress package
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # A shallow, sparse checkout of the test directories only; nothing from it is committed.
      - name: Fetch javac's tests
        run: cargo corpus jdk-tests
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Compare the lexer with javac on javac's tests
        run: cargo oracle tokens jdk-tests --json tokens-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Compare syntax errors with javac on javac's tests
        run: cargo oracle syntax jdk-tests --json syntax-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Compare trees with javac on javac's tests
        run: cargo oracle tree jdk-tests --json tree-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      # No file panics, or takes more than the provisional 10 s. Without javac: about 3 s.
      - name: Attribute javac's tests
        run: cargo oracle attribute jdk-tests --json attribute-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jdk-tests-reports
          path: "*-report.json"
          if-no-files-found: ignore

  classfile:
    name: class file reading on the JDK matrix
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # The JDKs whose platform APIs are compared: the LTS releases from 8, and the latest, from
      # more than one vendor, with compressed images (the JetBrains Runtime). The last one set up,
      # Temurin 27, is JAVA_HOME: it builds the oracle and runs javap for every input.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: corretto-8
        with:
          distribution: corretto
          java-version: "8" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: temurin-11
        with:
          distribution: temurin
          java-version: "11" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: corretto-17
        with:
          distribution: corretto
          java-version: "17" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: corretto-21
        with:
          distribution: corretto
          java-version: "21" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: jetbrains-21
        with:
          distribution: jetbrains
          java-version: "21" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: corretto-25
        with:
          distribution: corretto
          java-version: "25" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: jetbrains-25
        with:
          distribution: jetbrains
          java-version: "25" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: corretto-27
        with:
          distribution: corretto
          java-version: "27" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        id: temurin-27
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Build the javap oracle
        working-directory: tools/javap-oracle
        run: mvn --batch-mode --no-transfer-progress package
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compare class file reading on every JDK
        run: >-
          cargo oracle classfile --json classfile-jdks.json
          --jdk "${{ steps.corretto-8.outputs.path }}"
          --jdk "${{ steps.temurin-11.outputs.path }}"
          --jdk "${{ steps.corretto-17.outputs.path }}"
          --jdk "${{ steps.corretto-21.outputs.path }}"
          --jdk "${{ steps.jetbrains-21.outputs.path }}"
          --jdk "${{ steps.corretto-25.outputs.path }}"
          --jdk "${{ steps.jetbrains-25.outputs.path }}"
          --jdk "${{ steps.corretto-27.outputs.path }}"
          --jdk "${{ steps.temurin-27.outputs.path }}"
        env:
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      # The jars are kept out of target/, so the Rust cache doesn't save them.
      - name: Fetch the corpus's jars
        run: cargo corpus fetch
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Compare class file reading on the corpus's jars
        run: cargo oracle classfile --json classfile-corpus.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Upload the reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: classfile-report
          path: classfile-*.json
          if-no-files-found: ignore

  names:
    name: name resolution on every corpus project
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # Each project's build and javac run on the JDK its lock names (JAVA_HOME_<N>_X64); the
      # last one set up, 27, is JAVA_HOME, which builds the oracle.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Build the javac oracle
        working-directory: tools/javac-oracle
        run: mvn --batch-mode --no-transfer-progress package
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The projects, their jars, and the generated sources are kept out of target/, so the Rust
      # cache doesn't save them.
      - name: Fetch the corpus
        run: cargo corpus fetch
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # What the builds generate other than with annotation processors, which the oracle runs:
      # Helidon's templates, ANTLR's and protobuf's output, caffeine's code generator's and the
      # jar its processor paths name.
      - name: Generate the corpus's sources
        run: cargo corpus generate
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # Every source set of every project, two javac JVMs at a time on the runner's 16 GB, and
      # each project's names from an engine given every file as an edit, too.
      - name: Compare name resolution with javac
        run: cargo oracle names --replay --jobs 2 --heap 5g --json names-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: names-report
          path: names-report.json
          if-no-files-found: ignore

  types:
    name: type attribution on every corpus project
    runs-on: ubuntu-latest
    steps:
      - uses: taiki-e/checkout-action@7d1e50e93dc4fb3bba58f85018fadf77898aee8b # v1.4.2
      # As in the names job: each project's javac runs on the JDK its lock names; 27, set up
      # last, builds the oracle.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "26" # matrix
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
      - name: Build the javac oracle
        working-directory: tools/javac-oracle
        run: mvn --batch-mode --no-transfer-progress package
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch the corpus
        run: cargo corpus fetch
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      - name: Generate the corpus's sources
        run: cargo corpus generate
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
      # The relation queries (B3a) and the files' attribution (B3b), with Ferrion's side: every
      # source set compiles, and the report gives the entries, the relation queries, and javac's
      # analysis time per file.
      - name: Compare type attribution and relations with javac
        run: cargo oracle types --jobs 2 --heap 5g --json types-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      # From the cache the step above filled: this runs no javac, and takes about two minutes.
      - name: Check that a removed symbol is never a guess
        run: cargo oracle removed --json removed-report.json
        env:
          FERRION_CORPUS_DIR: ${{ runner.temp }}/corpus
          FERRION_ORACLE_CACHE: ${{ runner.temp }}/oracle
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: types-report
          path: |
            types-report.json
            removed-report.json
          if-no-files-found: ignore
